version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo SDK packages must move together: upgrade them with `npx expo install --fix`.
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native*', 'react', 'react-dom']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
